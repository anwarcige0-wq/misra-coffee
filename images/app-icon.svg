<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#36231C"/>
      <stop offset="100%" stop-color="#140A07"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D194"/>
      <stop offset="50%" stop-color="#C9A15D"/>
      <stop offset="100%" stop-color="#9A7432"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Coffee Cup Outer Emblem -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#gold)" stroke-width="10" filter="url(#glow)"/>
  
  <!-- Cup Base & Body -->
  <path d="M160 230 h150 v60 a75 75 0 0 1 -150 0 z" fill="rgba(201, 161, 93, 0.15)" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Cup Handle -->
  <path d="M310 245 h25 a30 30 0 0 1 0 60 h-25" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Steam Curves -->
  <path d="M200 150 c-15 25 15 35 0 60" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
  <path d="M255 140 c-15 25 15 35 0 60" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
  <path d="M310 150 c-15 25 15 35 0 60" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>

  <!-- Brand Typography -->
  <text x="256" y="420" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="700" fill="#FAF6F0" letter-spacing="6" text-anchor="middle">MISRA COFFEE</text>
  <text x="256" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="url(#gold)" letter-spacing="8" text-anchor="middle">WEB APPLICATION</text>
</svg>
